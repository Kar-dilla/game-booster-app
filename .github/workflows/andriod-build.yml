name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o GameBrain1.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: GameBrain
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gamebrain-debug-apk
          path: GameBrain/app/build/outputs/apk/debug/*.apk

      - name: Repair local Gradle wrapper (download once, commit if missing)
        working-directory: GameBrain
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Upload regenerated wrapper jar
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-jar
          path: GameBrain/gradle/wrapper/gradle-wrapper.jar
