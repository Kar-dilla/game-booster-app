name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o GameBrain1.zip

      - name: Restore Gradle wrapper jar
        run: cp gradle-wrapper.jar GameBrain/gradle/wrapper/gradle-wrapper.jar

      - name: Fix gradlew line endings
        run: sed -i 's/\r$//' GameBrain/gradlew

      - name: Make gradlew executable
        run: chmod +x GameBrain/gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: GameBrain
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gamebrain-debug-apk
          path: GameBrain/app/build/outputs/apk/debug/*.apk
