name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract Project ZIP
      run: |
        unzip -o project.zip -d temp_unzip
        # Look for build.gradle to find the true project root
        PROJECT_ROOT=$(find temp_unzip -name "build.gradle" -o -name "settings.gradle" | head -n 1 | xargs -r dirname)
        if [ -n "$PROJECT_ROOT" ]; then
          cp -a "$PROJECT_ROOT"/. .
        else
          cp -a temp_unzip/. .
        fi
        rm -rf temp_unzip

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
