name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract Project ZIP
      run: |
        unzip -o project.zip -d extracted_zip
        
        echo "--- WHAT IS INSIDE THE ZIP ---"
        find extracted_zip
        echo "------------------------------"

        # Aggressively hunt for the true project root
        ROOT_DIR=$(find extracted_zip -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "gradlew" | head -n 1 | xargs -r dirname)
        
        # Fallback if settings.gradle is missing
        if [ -z "$ROOT_DIR" ]; then
          ROOT_DIR=$(find extracted_zip -name "build.gradle" -o -name "build.gradle.kts" | head -n 1 | xargs -r dirname)
        fi

        if [ -n "$ROOT_DIR" ]; then
          echo "Found Android project at: $ROOT_DIR"
          cp -r "$ROOT_DIR"/* .
          cp -r "$ROOT_DIR"/.* . 2>/dev/null || true
        else
          echo "Error: Could not find Android project files!"
          exit 1
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/**/*.apk"
