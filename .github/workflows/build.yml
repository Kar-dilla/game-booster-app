name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract Project ZIP
      run: |
        unzip -o project.zip -d temp_unzip
        PROJECT_ROOT=$(find temp_unzip -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "gradlew" | head -n 1 | xargs -r dirname)
        if [ -z "$PROJECT_ROOT" ]; then
          PROJECT_ROOT=$(find temp_unzip -name "build.gradle" -o -name "build.gradle.kts" | head -n 1 | xargs -r dirname)
        fi

        if [ -n "$PROJECT_ROOT" ]; then
          cp -r "$PROJECT_ROOT"/* .
          cp -r "$PROJECT_ROOT"/.* . 2>/dev/null || true
        else
          cp -r temp_unzip/* .
        fi
        rm -rf temp_unzip

    - name: Patch SessionEngine.kt
      run: |
        find . -name "SessionEngine.kt" -exec sed -i 's/ACTION_BLUETOOTH/android.provider.Settings.ACTION_BLUETOOTH_SETTINGS/g' {} +

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/**/*.apk"

